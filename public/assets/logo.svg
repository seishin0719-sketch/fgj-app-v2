<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E3A1"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E3A1"/>
      <stop offset="100%" stop-color="#C99A2E"/>
    </linearGradient>
  </defs>

  <!-- 紫色圓角底板 -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#vg)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#gg)" stroke-width="2.5"/>

  <!-- 房屋主體（金色） -->
  <path d="M60 24 L97 52 L88 52 L88 84 L32 84 L32 52 L23 52 Z"
        fill="rgba(255,255,255,0.10)" stroke="url(#gg)" stroke-width="3.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 屋頂實心 -->
  <path d="M60 27 L94 52 L60 52 Z" fill="url(#gg)" opacity="0.92"/>
  <!-- 屋簷線 -->
  <line x1="30" y1="52" x2="90" y2="52" stroke="url(#gg)" stroke-width="3" stroke-linecap="round"/>

  <!-- 門（中央盾牌造型，象徵安全守護） -->
  <path d="M60 56 L72 61 L72 72 C72 78 66 82 60 84 C54 82 48 78 48 72 L48 61 Z"
        fill="url(#shield)"/>
  <!-- 盾牌內的勾 -->
  <path d="M54 71 L58.5 75.5 L67 66.5" fill="none" stroke="#3B0764"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 左右窗戶 -->
  <rect x="38" y="58" width="8" height="8" rx="1.5" fill="url(#gg)" opacity="0.85"/>
  <rect x="74" y="58" width="8" height="8" rx="1.5" fill="url(#gg)" opacity="0.85"/>

  <!-- 頂端皇冠點綴（尊貴感） -->
  <path d="M60 12 L65 18 L60 22 L55 18 Z" fill="url(#gg)"/>
</svg>
